<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar interactiva</title>
<style>
  :root {
    --bg-navbar: #29374d;
    --bg-input: #1c2632;
    --text-white: #f1f5f9;
    --text-muted: #94a3b8;
    --accent-teal: #5eead4;
    --btn-bg: #7c8797;
    --btn-text: #f1f5f9;
    --dropdown-bg: #1f2a3a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #101722;
  }

  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-navbar);
    padding: 14px 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .navbar-left {
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .brand-name {
    color: var(--text-white);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 26px;
    list-style: none;
    margin: 0;
    padding: 0;
    flex-wrap: wrap;
  }

  .nav-links a {
    color: var(--text-white);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: color 0.2s ease;
  }

  .nav-links a:hover,
  .nav-links a:focus-visible {
    color: var(--accent-teal);
  }

  .nav-links .active {
    color: var(--accent-teal);
  }

  .nav-links .active:hover,
  .nav-links .active:focus-visible {
    color: var(--text-white);
  }

  .dropdown {
    position: relative;
  }

  .dropdown-toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }

  .dropdown-toggle .chevron {
    width: 10px;
    height: 10px;
    transition: transform 0.2s ease;
  }

  .dropdown.open .dropdown-toggle .chevron {
    transform: rotate(180deg);
  }

  .dropdown-menu {
    position: absolute;
    top: calc(100% + 14px);
    left: 0;
    background: var(--dropdown-bg);
    border-radius: 8px;
    list-style: none;
    margin: 0;
    padding: 8px;
    min-width: 160px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
  }

  .dropdown.open .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .dropdown-menu li a {
    display: block;
    padding: 8px 10px;
    border-radius: 6px;
    font-weight: 400;
    font-size: 14px;
  }

  .dropdown-menu li a:hover {
    background: rgba(255, 255, 255, 0.06);
  }

  .navbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-input {
    background: var(--bg-input);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text-muted);
    padding: 9px 14px;
    border-radius: 6px;
    font-size: 14px;
    width: 200px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .search-input::placeholder {
    color: var(--text-muted);
  }

  .search-input:focus {
    border-color: var(--accent-teal);
  }

  .search-btn {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .search-btn:hover,
  .search-btn:focus-visible {
    background: var(--accent-teal);
    color: #0f2b28;
  }

  @media (max-width: 720px) {
    .navbar-left { gap: 16px; }
    .nav-links { gap: 16px; }
    .search-input { width: 140px; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-left">
    <div class="brand">
      <svg class="avatar" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="20" fill="#5eead4"/>
        <circle cx="20" cy="16" r="7" fill="#0f2b28"/>
        <path d="M6 34c1.5-8 8-11.5 14-11.5S32.5 26 34 34" fill="#0f2b28"/>
      </svg>
      <span class="brand-name">Navbar</span>
    </div>

    <ul class="nav-links">
      <li><a href="#" class="active">Inicio</a></li>
      <li><a href="#">Características</a></li>
      <li><a href="#">Precios</a></li>
      <li><a href="#">Acerca de</a></li>
      <li class="dropdown" id="dropdown">
        <button class="dropdown-toggle" id="dropdownToggle" aria-haspopup="true" aria-expanded="false">
          Despregable
          <svg class="chevron" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <ul class="dropdown-menu">
          <li><a href="#">Opción 1</a></li>
          <li><a href="#">Opción 2</a></li>
          <li><a href="#">Opción 3</a></li>
        </ul>
      </li>
    </ul>
  </div>

  <div class="navbar-right">
    <input type="text" class="search-input" placeholder="Búsqueda">
    <button class="search-btn">Búsqueda</button>
  </div>
</nav>

<script>
  const dropdown = document.getElementById('dropdown');
  const toggle = document.getElementById('dropdownToggle');

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = dropdown.classList.toggle('open');
    toggle.setAttribute('aria-expanded', isOpen);
  });

  document.addEventListener('click', () => {
    dropdown.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  });
</script>

</body>
</html>
